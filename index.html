<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AlgoTradingBot - Meta Ad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #000;
      color: white;
      margin: 0;
      padding: 0;
      /* Hide scrollbar for the page */
      overflow: hidden;
    }

    /* Dynamic Tech Background */
    .bg-reel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1025 50%, #000000 100%);
      z-index: 0;
    }

    .bg-reel::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.15) 0%, transparent 60%);
      animation: pulse 8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% {
        transform: scale(1) translate(0, 0);
      }

      100% {
        transform: scale(1.2) translate(5%, 5%);
      }
    }

    /* Hide scrollbar for product carousel */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .bottom-gradient {
      background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.8) 40%, transparent 100%);
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-[100dvh] bg-gray-900 cursor-pointer" id="mainBody">

  <!-- Mobile Simulator Wrapper -->
  <div
    class="relative w-full h-[100dvh] sm:max-w-[400px] sm:h-[850px] sm:max-h-[100dvh] bg-black sm:rounded-[40px] sm:border-[8px] sm:border-gray-800 overflow-hidden shadow-2xl flex flex-col">

    <!-- Video/Background Layer -->
    <video id="bgVideo" src="./assets/bg-video.mp4" loop playsinline muted autoplay
      class="absolute top-0 left-0 w-full h-full object-cover z-0"></video>
    <div class="absolute inset-0 bg-black/10 z-10 pointer-events-none"></div>

    <!-- Unmute Overlay -->
    <div id="unmuteOverlay"
      class="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm transition-opacity duration-300">
      <div
        class="flex flex-col items-center gap-3 p-6 bg-black/60 rounded-2xl border border-white/20 shadow-2xl animate-pulse">
        <i data-lucide="volume-x" class="w-12 h-12 text-white"></i>
        <span class="text-white font-bold text-lg tracking-wide text-center">Tap anywhere<br>to turn on sound</span>
      </div>
    </div>

    <!-- Top Header Overlay -->
    <div
      class="absolute top-0 w-full pt-4 px-4 pb-12 z-20 bg-gradient-to-b from-black/60 to-transparent flex items-center justify-between">
      <div class="flex items-center gap-2">
        <!-- Algo Logo -->
        <div class="w-8 h-8 rounded-md flex items-center justify-center p-[2px]"
          style="background: rgba(0,0,0,0.5); border: 1px solid rgba(124, 58, 237, 0.5)">
          <img src="./assets/logo.png" class="w-full h-full object-contain rounded-md" alt="Logo">
        </div>
        <span class="font-bold text-lg tracking-tight">AlgoTrading<span class="text-[#7C3AED]">Bot</span></span>
        <i data-lucide="chevron-down" class="w-4 h-4 mt-1 opacity-80"></i>
      </div>
    </div>



    <!-- Bottom Overlay Content -->
    <div class="absolute bottom-[50px] w-full z-20 bottom-gradient pt-24 pb-4 px-4 flex flex-col gap-4">

      <!-- Product Carousel -->
      <div class="flex gap-3 overflow-x-auto no-scrollbar snap-x pb-2">
        <div
          class="snap-start shrink-0 w-[100px] h-[100px] rounded-xl overflow-hidden border border-white/20 shadow-xl bg-black/50 backdrop-blur-sm relative group cursor-pointer">
          <img src="./assets/bot-1.png"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" alt="Bot 1">
          <div class="absolute inset-0 border border-white/10 rounded-xl pointer-events-none"></div>
        </div>
        <div
          class="snap-start shrink-0 w-[100px] h-[100px] rounded-xl overflow-hidden border border-white/20 shadow-xl bg-black/50 backdrop-blur-sm relative group cursor-pointer">
          <img src="./assets/bot-2.png"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" alt="Bot 2">
          <div class="absolute inset-0 border border-white/10 rounded-xl pointer-events-none"></div>
        </div>
        <div
          class="snap-start shrink-0 w-[100px] h-[100px] rounded-xl overflow-hidden border border-white/20 shadow-xl bg-black/50 backdrop-blur-sm relative group cursor-pointer">
          <img src="./assets/bot-3.png"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" alt="Bot 3">
          <div class="absolute inset-0 border border-white/10 rounded-xl pointer-events-none"></div>
        </div>
      </div>

      <!-- Profile & Sponsor Info -->
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full overflow-hidden border border-white/30 bg-black/50">
          <img src="./assets/logo.png" class="w-full h-full object-cover" alt="Profile">
        </div>
        <span class="font-semibold text-[15px] drop-shadow-md">algotradingbot</span>
        <button
          class="ml-2 border border-white/40 rounded-full px-3 py-1 text-xs font-medium hover:bg-white/10 transition-colors">Follow</button>
      </div>

      <!-- WhatsApp CTA -->
      <a href="http://wa.me/918240026380" target="_blank"
        class="w-full bg-[#25D366] hover:bg-[#20b858] transition-colors rounded-lg py-3 px-4 flex items-center justify-between cursor-pointer shadow-[0_0_15px_rgba(37,211,102,0.3)]">
        <div class="flex items-center gap-2">
          <!-- WhatsApp SVG Icon -->
          <svg class="w-5 h-5 text-white fill-current drop-shadow-sm" viewBox="0 0 24 24">
            <path
              d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" />
          </svg>
          <span class="font-bold text-[15px] tracking-wide text-white drop-shadow-sm">Go to WhatsApp</span>
        </div>
        <i data-lucide="chevron-right" class="w-5 h-5 text-white"></i>
      </a>

      <!-- Description & Audio -->
      <div class="flex flex-col gap-1.5 drop-shadow-md">
        <p class="text-[13.5px] font-normal leading-snug pr-8 text-white/90">
          New drop! High frequency, low latency, maximum profit algo bots 🚀
        </p>
        <div class="flex items-center gap-2 mt-1">
          <i data-lucide="music" class="w-3.5 h-3.5 opacity-80"></i>
          <span class="text-[12px] font-medium text-white/90">Original Audio</span>
        </div>
      </div>

    </div>

    <!-- Bottom Nav Bar (Simulating Instagram App) -->
    <div
      class="absolute bottom-0 w-full h-[50px] bg-black border-t border-white/10 z-30 flex items-center justify-around px-2">
      <i data-lucide="home" class="w-6 h-6 text-white cursor-pointer hover:scale-110 transition-transform"></i>
      <i data-lucide="search"
        class="w-6 h-6 text-white cursor-pointer opacity-70 hover:opacity-100 transition-opacity"></i>
      <div
        class="w-[22px] h-[22px] border-2 border-white rounded-[6px] flex items-center justify-center cursor-pointer opacity-70 hover:opacity-100 transition-opacity">
        <i data-lucide="plus" class="w-3.5 h-3.5 text-white"></i>
      </div>
      <i data-lucide="film"
        class="w-6 h-6 text-white cursor-pointer opacity-70 hover:opacity-100 transition-opacity"></i>
      <div
        class="w-6 h-6 rounded-full border border-white overflow-hidden cursor-pointer opacity-70 hover:opacity-100 transition-opacity">
        <img src="./assets/logo.png" class="w-full h-full object-cover">
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();

    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('bgVideo');
      const unmuteOverlay = document.getElementById('unmuteOverlay');
      const mainBody = document.getElementById('mainBody');
      let isMuted = true;

      // Force play visually (muted)
      video.play().catch(e => console.log('Autoplay blocked:', e));

      // Handle the first click (unmute) and subsequent clicks (redirect)
      mainBody.addEventListener('click', (e) => {
        // If they click the WhatsApp button explicitly, redirect immediately
        if (e.target.closest('a')) {
          return;
        }

        if (isMuted) {
          // First click on background: Unmute the video
          e.preventDefault();
          video.muted = false;
          video.currentTime = 0; // Restart video with sound
          video.play();
          unmuteOverlay.style.opacity = '0';
          setTimeout(() => { unmuteOverlay.style.display = 'none'; }, 300);
          isMuted = false;
        } else {
          // Second click anywhere: Redirect to WhatsApp
          window.location.href = 'http://wa.me/918240026380';
        }
      });
    });
  </script>
</body>

</html>
